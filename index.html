<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="献立表">
  <title>献立表</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ローディング -->
<div id="loading-screen" class="screen">
  <div class="loading-spinner"></div>
  <p>読み込み中…</p>
</div>

<!-- 認証 -->
<div id="auth-screen" class="screen hidden">
  <div class="auth-content">
    <div class="app-logo">🍱</div>
    <h1>献立表</h1>
    <p class="subtitle">家族の食事をスマートに管理</p>

    <!-- ログイン / 新規登録 切り替えタブ -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login">ログイン</button>
      <button class="auth-tab" id="tab-register">新規登録</button>
    </div>

    <form id="auth-form" autocomplete="on">
      <div class="form-group">
        <input type="email" id="auth-email" placeholder="メールアドレス"
               autocomplete="email" inputmode="email" required>
      </div>
      <div class="form-group">
        <input type="password" id="auth-password" placeholder="パスワード（6文字以上）"
               autocomplete="current-password" minlength="6" required>
      </div>
      <p id="auth-error" class="auth-error"></p>
      <button type="submit" id="btn-auth-submit" class="btn btn-primary btn-large">ログイン</button>
      <button type="button" id="btn-forgot-password" class="btn-forgot">パスワードを忘れた場合</button>
    </form>
  </div>
</div>

<!-- 世帯設定 -->
<div id="household-screen" class="screen hidden">
  <div class="household-content">
    <div style="font-size:48px;text-align:center;margin-bottom:16px">🏠</div>
    <h2>はじめに</h2>
    <p>新しく始めるか、ご家族の献立表に参加してください</p>
    <button id="btn-create-household" class="btn btn-primary" style="margin-bottom:4px">新しく始める</button>
    <div class="divider">または</div>
    <div class="join-form">
      <input id="share-code-input" type="text" placeholder="共有コード（6文字）" maxlength="6" autocomplete="off">
      <button id="btn-join-household" class="btn btn-secondary">参加する</button>
    </div>
  </div>
</div>

<!-- メインアプリ -->
<div id="app" class="screen hidden" style="display:flex;flex-direction:column;">

  <!-- ヘッダー -->
  <header id="app-header">
    <div class="header-left">
      <button class="icon-btn" id="btn-prev-month">‹</button>
    </div>
    <div class="header-center">
      <h1 id="month-title">2026年4月</h1>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="btn-next-month">›</button>
      <button class="icon-btn" id="btn-sort-toggle" title="並び順切り替え">↕</button>
      <button class="icon-btn" id="btn-month-dice" title="月をランダム生成">🎲</button>
    </div>
  </header>

  <!-- コンテンツ -->
  <div id="content-area" style="flex:1;overflow:hidden;position:relative;">

    <!-- 月次表示 -->
    <div id="monthly-view" class="view" style="background:#fff;">
      <div class="table-wrapper">
        <table id="meal-table">
          <thead>
            <tr>
              <th class="col-date">日付</th>
              <th class="col-meal">朝食</th>
              <th class="col-meal">昼食</th>
              <th class="col-meal">夕食</th>
            </tr>
          </thead>
          <tbody id="meal-table-body"></tbody>
        </table>
      </div>
    </div>

    <!-- 日別詳細 -->
    <div id="daily-view" class="view hidden">
      <div class="daily-header">
        <button class="btn btn-text" id="btn-back-monthly">← 戻る</button>
        <h2 id="daily-date-title"></h2>
        <button class="icon-btn" id="btn-day-dice" title="1日をランダム生成">🎲</button>
      </div>
      <div class="ingredient-filter">
        <p class="filter-label">🔍 食材で絞り込み（ランダム生成時に反映）</p>
        <div id="ingredient-tags" class="tag-list"></div>
      </div>
      <div id="daily-meals" class="meal-cards"></div>
    </div>

    <!-- 献立DB -->
    <div id="db-view" class="view hidden">
      <div class="db-header">
        <h2>献立データベース</h2>
        <button class="btn btn-primary btn-small" id="btn-add-dish">＋ 追加</button>
      </div>
      <div class="db-type-tabs">
        <button class="db-tab active" data-type="main">主菜（50）</button>
        <button class="db-tab" data-type="side">副菜（50）</button>
      </div>
      <div class="db-search-wrap">
        <input type="text" id="db-search-input" placeholder="🔍 料理名で検索…" autocomplete="off">
      </div>
      <div id="dish-list" class="dish-list"></div>
    </div>

    <!-- 設定 -->
    <div id="settings-view" class="view hidden">
      <div class="settings-header"><h2>設定</h2></div>
      <div class="settings-section-title" style="padding:0 16px 6px;font-size:12px;color:#888;font-weight:600;">アカウント</div>
      <div class="settings-section">
        <div class="settings-row">
          <span class="settings-row-label">ログイン中</span>
          <span class="settings-row-value" id="settings-user-email"></span>
        </div>
        <div class="settings-row" id="row-share-code" style="cursor:pointer;">
          <span class="settings-row-label">共有コードを表示</span>
          <span style="color:#aaa;font-size:18px;">›</span>
        </div>
        <div class="settings-row" id="row-sign-out" style="cursor:pointer;">
          <span class="settings-row-label" style="color:#FF3B30;">ログアウト</span>
        </div>
      </div>
      <div class="settings-section-title" style="padding:0 16px 6px;font-size:12px;color:#888;font-weight:600;">献立DB</div>
      <div class="settings-section">
        <div class="settings-row" id="row-migrate-dishes" style="cursor:pointer;">
          <span class="settings-row-label">食事時間帯タグを更新</span>
          <span style="color:#aaa;font-size:18px;">›</span>
        </div>
        <div class="settings-row" id="row-export-csv" style="cursor:pointer;">
          <span class="settings-row-label">献立DBをCSV書き出し</span>
          <span style="color:#aaa;font-size:18px;">›</span>
        </div>
      </div>
    </div>

  </div>

  <!-- ボトムナビ -->
  <nav id="bottom-nav">
    <button class="nav-btn active" data-view="monthly">
      <span class="nav-icon">📅</span>
      <span class="nav-label">献立表</span>
    </button>
    <button class="nav-btn" data-view="db">
      <span class="nav-icon">📖</span>
      <span class="nav-label">献立DB</span>
    </button>
    <button class="nav-btn" data-view="settings">
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">設定</span>
    </button>
  </nav>

</div>

<!-- 献立追加・編集モーダル -->
<div id="dish-modal" class="modal hidden">
  <div class="modal-overlay" id="dish-modal-overlay"></div>
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="dish-modal-title">献立を追加</div>
    <div class="modal-body">
      <form id="dish-form">
        <input type="hidden" id="dish-edit-id">
        <input type="hidden" id="dish-image-url-current">
        <div class="form-group">
          <label>料理名 *</label>
          <input type="text" id="dish-name" placeholder="例：鮭の塩焼き" required>
        </div>
        <div class="form-group">
          <label>種類 *</label>
          <select id="dish-type">
            <option value="main">主菜</option>
            <option value="side">副菜</option>
          </select>
        </div>
        <div class="form-group">
          <label>食事の時間帯</label>
          <select id="dish-meal-time">
            <option value="any">いつでも</option>
            <option value="morning">朝向け</option>
            <option value="lunch_dinner">昼・夕向け</option>
          </select>
        </div>
        <div class="form-group">
          <label>カテゴリ</label>
          <select id="dish-category">
            <option value="和食">和食</option>
            <option value="洋食">洋食</option>
            <option value="中華">中華</option>
            <option value="その他">その他</option>
          </select>
        </div>
        <div class="form-group">
          <label>食材タグ</label>
          <div id="ingredient-check-grid" class="ingredient-check-grid"></div>
        </div>
        <div class="form-group">
          <label>レシピURL（外部サイト）</label>
          <input type="url" id="dish-recipe-url" placeholder="https://...">
        </div>
        <div class="form-group">
          <label>レシピ本文（直接入力）</label>
          <textarea id="dish-recipe-text" rows="5" placeholder="材料や手順をここに入力…"></textarea>
        </div>
        <div class="form-group">
          <label>料理の写真</label>
          <div class="image-upload-area" id="image-upload-area">
            <img id="dish-image-preview" class="dish-image-preview hidden" alt="プレビュー">
            <label class="image-upload-label" id="image-upload-label" for="dish-image-input">
              <span id="image-upload-hint">📷 写真を選択</span>
            </label>
            <input type="file" id="dish-image-input" accept="image/*" style="display:none;">
            <button type="button" id="btn-remove-image" class="btn-remove-image hidden">✕ 写真を削除</button>
          </div>
        </div>
        <div class="form-group">
          <label>メモ</label>
          <textarea id="dish-memo" rows="2" placeholder="メモ（任意）"></textarea>
        </div>
        <div class="form-actions">
          <button type="button" id="btn-cancel-dish" class="btn btn-secondary">キャンセル</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- レシピ詳細モーダル -->
<div id="recipe-modal" class="modal hidden">
  <div class="modal-overlay" id="recipe-modal-overlay"></div>
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="recipe-modal-title"></div>
    <div class="modal-body">
      <img id="recipe-modal-image" class="recipe-modal-image hidden" alt="">
      <div id="recipe-modal-text" class="recipe-modal-text"></div>
      <div class="form-actions" style="margin-top:16px;">
        <button id="btn-recipe-search" class="btn btn-secondary hidden">🔍 検索</button>
        <button id="btn-recipe-url" class="btn btn-primary hidden">🔗 レシピサイトへ</button>
        <button id="btn-close-recipe-modal" class="btn btn-secondary">閉じる</button>
      </div>
    </div>
  </div>
</div>

<!-- 共有コードモーダル -->
<div id="share-modal" class="modal hidden">
  <div class="modal-overlay" id="share-modal-overlay"></div>
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">共有コード</div>
    <div class="modal-body">
      <p style="color:#555;margin-bottom:12px;line-height:1.6;">このコードをご家族に伝えると、同じ献立表を共有・編集できます。</p>
      <div class="share-code-box" id="share-code-display"></div>
      <div class="form-actions" style="margin-top:16px;">
        <button id="btn-copy-share-code" class="btn btn-primary">コピー</button>
        <button id="btn-close-share-modal" class="btn btn-secondary">閉じる</button>
      </div>
    </div>
  </div>
</div>

<!-- 確認モーダル -->
<div id="confirm-modal" class="modal hidden">
  <div class="modal-overlay" id="confirm-modal-overlay"></div>
  <div class="modal-sheet confirm-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="confirm-title">確認</div>
    <div class="modal-body">
      <p class="confirm-message" id="confirm-message"></p>
      <div class="form-actions">
        <button id="btn-confirm-cancel" class="btn btn-secondary">キャンセル</button>
        <button id="btn-confirm-ok" class="btn btn-danger">実行</button>
      </div>
    </div>
  </div>
</div>

<!-- 献立選択モーダル -->
<div id="dish-select-modal" class="modal hidden">
  <div class="modal-overlay" id="dish-select-modal-overlay"></div>
  <div class="modal-sheet dish-select-sheet">
    <div class="modal-handle"></div>
    <div class="dish-select-header">
      <div class="modal-title" id="dish-select-title">献立を選択</div>
      <button class="btn btn-primary btn-small" id="btn-dish-select-add">＋ 新規追加</button>
    </div>
    <div class="dish-select-search-wrap">
      <input type="text" id="dish-select-search" placeholder="🔍 料理名で検索…" autocomplete="off">
    </div>
    <div id="dish-select-list" class="dish-select-list"></div>
  </div>
</div>

<!-- スナックバー -->
<div id="snackbar"></div>

<!-- ローディングオーバーレイ -->
<div id="overlay-loading" class="hidden">
  <div class="loading-spinner"></div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

<!-- アプリスクリプト -->
<script src="js/config.js"></script>
<script src="js/dishes-data.js"></script>
<script src="js/holidays.js"></script>
<script src="js/app.js"></script>

</body>
</html>
